<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monty Hall Problem Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
    <h1>Monty Hall Problem Simulator</h1>
    <p>
        Simulate three player strategies — <strong>Always Switch</strong>, <strong>Always Stay</strong>,
        and <strong>Coin Flip</strong> — and compare how often each strategy wins the car.
    </p>

    <form id="simulation-form">
        <label for="runs">Number of simulation runs per strategy</label>
        <input type="number" id="runs" name="runs" min="1" step="1" value="100000" required>
        <button type="submit" id="submit-button">Run Simulations</button>
    </form>

    <p id="error-message" class="error" hidden></p>

    <table id="results-table" hidden>
        <thead>
        <tr>
            <th>Strategy</th>
            <th>Car Count</th>
            <th>Goat Count</th>
            <th>Win %</th>
        </tr>
        </thead>
        <tbody id="results-body"></tbody>
    </table>
</main>
<script src="app.js"></script>
</body>
</html>
